# Copy this file to $XDG_CONFIG_HOME/lok/config.ini or ~/.config/lok/config.ini.
# All settings are optional. Changes take effect the next time lok starts.
# Use UTF-8 and # for comments. Booleans are true or false.
# The locker runs its UI as nobody with that account's primary group.

[colors]
# Background for idle, typing, alternate typing, failed password and Caps Lock.
# Use an X11 color name or a hex color such as #005577.
idle = #000000
typing = #005577
typing_alt = #227799
failed = #cc3333
caps_lock = #cc6600
# Text uses foreground for the title and dim_foreground for subtitle and footer.
foreground = #eeeeee
dim_foreground = #c5c8c9

[emoji]
# Leave an entry empty to hide the emoji for that state.
idle = 🐒
typing = 🙈
typing_alt = 🙉
failed = 🙊
caps_lock = 🐵

[appearance]
show_emoji = true
# Alternate between typing and typing_alt on each keypress. -A overrides this.
typing_background_feedback = false
# Gap in the centered text stack and margin below the footer, in pixels.
text_gap = 24
bottom_margin = 36

[text]
# Leave a value empty to hide that text. -t, -s and -b override the corresponding
# title, subtitle (including the fingerprint variant) and footer.
title = This computer is locked
subtitle = Type your password to unlock
fingerprint_subtitle = Type your password or use fingerprint to unlock
footer = %A %d %B  ·  %H:%M:%S
# These replace the subtitle during the corresponding lock state.
caps_lock = Caps Lock is on
# %d displays the attempt count and %% displays a literal percent sign.
failed_attempt = 1 failed attempt
failed_attempts = %d failed attempts

[fonts]
# Pango font descriptions. Use a color emoji font for the emoji.
emoji = Noto Color Emoji 96
title = Sans Bold 32
subtitle = Sans 14
footer = Sans 11

[datetime]
# Expand strftime codes every second. -T/-S/-B override these settings.
title = true
subtitle = true
footer = true

[fingerprint]
# The host still needs the dedicated lok-fingerprint PAM service and fprintd.
enabled = true
# Turning this off hides the indicator while keeping fingerprint unlock enabled.
show_icon = true

[lock]
# Use the failed-password background when the password buffer is cleared.
fail_on_clear = false
# DPMS standby, suspend and off timeout in seconds. 0 keeps the X server settings.
monitor_timeout = 0
